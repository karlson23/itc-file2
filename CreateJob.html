
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>DevLink</title>
    <link rel="stylesheet" href="CreateJob.css">
</head>
<body>

    

    <header>
        <h2>DevLink{}</h2>

        <div class="buttons">
            <a href="../main_page.html">Home</a>
            <a href="../login_page.html">Logout</a>
        </div>
    </header>

    <main>
        <div class="box">
            <h1>Post a Job Opening</h1>

            <form>
                <label for="Title">Job Title / Position</label>
                <input type="text" id="Title" value="" placeholder="Game Developer">

                <label for="CompanyName">Company Name</label>
                <input type="text" id="CompanyName" value="" placeholder="Riot Games" >

                <label for="Salary">Salary Range / Compensation</label>
                <input type="text" id="Salary" value="" placeholder="$100 - $300 / week" >
                
                <label for="JobDescription">Job Description & Requirements</label>
                <textarea id="Notes" rows="3" placeholder="Describe responsibilities and specialized tech stack Requirements" ></textarea>

                <button type="button">Submit</button>
            </form>
        </div>
    </main>



</body>
</html>
