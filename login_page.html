<!DOCTYPE html>
<html>
<head>
    <title>DevLink Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <video autoplay muted loop playsinline id="bg">
        <source src="Backgrounds/background_3.mp4" type="video/mp4">
    </video>

    <div class="login">
        <h2>DevLink{}</h2>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Username or Email">

            <label>Password</label>
            <input type="password" placeholder="Password">

            <button type="button" onclick="window.location.href='main_page.html';">Login</button>

        </form>

        <p>No account? <a href="#">Register here</a></p>
    </div>

</body>
</html>
