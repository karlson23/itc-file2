
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>DevLink</title>
    <link rel="stylesheet" href="resume.css">
</head>
<body>

    

    <header>
        <h2>DevLink{}</h2>

        <div class="buttons">
            <a href="../main_page.html">Home</a>
            <a href="../login_page.html">Logout</a>
        </div>
    </header>

    <main>
        <div class="resume">
            <h1>Developer Resume &amp;<br>Skills</h1>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" value="Dustin Rebong">

                <label for="Job">Target role / Job</label>
                <input type="text" id="Job" value="3D Unity Game Developer">

                <label for="skills">Primary Tech Stack</label>
                <input type="text" id="skills"
                    value="Godot, GDscript, HTML/CSS/JAVASCRIPT">

                <label for="github">GitHub Profile URL</label>
                <input type="url" id="github"
                    value="https://github.com/User=DustinUser">

                <label for="linkedin">LinkedIn Profile URL</label>
                <input type="url" id="linkedin"
                    value="https://linkedin.com/User=DustinUser">

                <label for="bio">Professional Bio</label>
                <textarea id="bio" rows="3  ">Specialized developer looking for Game Dev Gigs.</textarea>

                <button type="button" onclick="window.location.href='../main_page.html';">Submit Resume</button>
            </form>
        </div>
    </main>



</body>
</html>
